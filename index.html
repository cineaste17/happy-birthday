:root{
  /* One fixed stage in a single violet world: seven die-cut photo stickers bounce screensaver-style
     behind one giant sticker-letter headline; tapping it opens the cake gag. */
  --ground:#D9CAFF;
  --violet:#6B49D6;
  --ink:#35207A;
  --paper:#FFF8EC;
  --sky:#A6DCFF;
  --butter:#FFE680;
  --rose:#FF9CCB;
  --mint:#8FECD2;
  --display:"Bagel Fat One","ZCOOL KuaiLe",ui-rounded,"Arial Rounded MT Bold","PingFang SC","Hiragino Sans GB","Apple SD Gothic Neo","Malgun Gothic","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  position:relative;overflow:hidden;color:var(--paper);font-family:var(--display);
  background:
    radial-gradient(circle,rgba(255,255,255,.5) 0 3.5px,transparent 4px) 0 0/52px 52px,
    radial-gradient(circle,rgba(255,255,255,.5) 0 3.5px,transparent 4px) 26px 26px/52px 52px,
    radial-gradient(120% 95% at 50% 46%,#EADFFF 0%,var(--ground) 50%,#C4AEF6 100%) var(--ground);
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit}

/* ---------- bouncing stickers ---------- */
#sky{position:absolute;inset:0;overflow:hidden;z-index:0}
.sp{position:absolute;left:0;top:0;will-change:transform;--c:var(--paper)}
.sp .in{position:relative;width:100%;height:100%;transform:rotate(var(--tilt,0deg))}
.sp i{position:absolute;inset:0;-webkit-mask:var(--m) center/100% 100% no-repeat;mask:var(--m) center/100% 100% no-repeat}
.sp .sh{background:var(--ink);opacity:.3;transform:translate(3%,4.5%)}
.sp .ed{background:var(--c);transition:background-color .28s}
.sp img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
@supports not ((mask-image:url("")) or (-webkit-mask-image:url(""))){.sp i{display:none}}

/* ---------- headline ---------- */
main{position:absolute;inset:0;z-index:1;display:grid;place-items:center;padding:72px 16px;pointer-events:none;container-type:size}
.hb{
  pointer-events:auto;appearance:none;border:0;background:none;padding:0;margin:0;cursor:pointer;
  display:block;
  transform:rotate(-3deg);transition:transform .28s cubic-bezier(.3,1.7,.5,1);
}
.hb:hover{transform:rotate(-1.5deg) scale(1.03)}
.hb:active{transform:rotate(-3deg) scale(.95)}
.hb:focus-visible{outline:4px solid var(--ink);outline-offset:12px;border-radius:28px}
#title{
  display:block;height:auto;overflow:visible;
  width:min(84vw,calc(34vh*var(--ar,2)),calc(var(--vbw,470)*1.5px));
  width:min(84cqw,calc(38cqh*var(--ar,2)),calc(var(--vbw,470)*1.5px));
}
#title.two{
  width:min(84vw,calc(40vh*var(--ar,2)),calc(var(--vbw,470)*1.12px));
  width:min(84cqw,calc(46cqh*var(--ar,2)),calc(var(--vbw,470)*1.12px));
}
#title text{font-family:var(--display);font-size:100px;letter-spacing:.03em}
#title g{stroke-linejoin:round;stroke-linecap:round}
.t-sh{fill:var(--ink);stroke:var(--ink);stroke-width:30px;opacity:.28;transform:translate(6px,10px)}
.t-bd{fill:var(--paper);stroke:var(--paper);stroke-width:30px}
.t-ky{fill:var(--ink);stroke:var(--ink);stroke-width:10px}
.t-fl{fill:var(--sky)}
/* the headline breathes to invite a tap */
.pulse{display:block;transform-origin:50% 55%;animation:breathe 1.1s ease-in-out infinite alternate}
@keyframes breathe{from{transform:scale(1)}to{transform:scale(1.05)}}

/* ---------- language switch ---------- */
.lang{
  position:absolute;top:16px;right:16px;z-index:12;display:flex;gap:2px;padding:4px;border-radius:999px;
  background:var(--paper);box-shadow:0 4px 0 rgba(53,32,122,.26);
}
.lang button{
  appearance:none;border:0;background:none;cursor:pointer;color:var(--ink);
  font-size:15px;line-height:1;padding:10px 13px 11px;border-radius:999px;min-height:38px;
}
.lang button[aria-pressed="true"]{background:var(--violet);color:var(--paper)}
.lang button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* ---------- the surprise ---------- */
.pop{
  position:absolute;inset:0;z-index:10;display:grid;place-items:center;overflow:hidden;
  background:rgba(88,58,190,.95);opacity:0;transition:opacity .22s;
}
.pop[hidden]{display:none}
.pop.on{opacity:1}
.rays{
  position:absolute;left:50%;top:44%;width:180vmax;height:180vmax;margin:-90vmax 0 0 -90vmax;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.1) 0 9deg,transparent 9deg 18deg);
  -webkit-mask:radial-gradient(closest-side,#000 0,transparent 58%);mask:radial-gradient(closest-side,#000 0,transparent 58%);
  animation:spin 70s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.col{position:relative;z-index:2;display:grid;justify-items:center;align-items:center;gap:12px;padding:58px 12px 18px;max-width:100%}
.col.wide{grid-template-columns:auto minmax(0,1fr);column-gap:20px;padding:14px 16px 14px 70px}
.col.wide #fit{grid-row:1 / span 2}
.col.wide .cap{align-self:end}
.col.wide .again{align-self:start}
#fit{position:relative}
.stage{position:absolute;left:0;top:0;width:1102px;height:1245px;transform-origin:0 0}
.fig{position:absolute;inset:0;transform-origin:50% 70%}
.fig .l{position:absolute;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.l.base{left:0;top:0;width:1102px;height:1245px;z-index:1}
.l.flap{left:440px;top:404px;width:299px;height:160px;z-index:3}
.l.arm{left:337px;top:395px;width:378px;height:148px;z-index:5;transform-origin:7px 52px}
.l.cuff{left:295px;top:379px;width:77px;height:137px;z-index:6}
.cake{position:absolute;left:0;top:0;width:200px;height:236px;z-index:2;opacity:0;transform-origin:50% 50%;pointer-events:none}
.cake svg{display:block;width:200px;height:236px;overflow:visible}
.cake .glow{opacity:0;transition:opacity .5s .2s}
.cake .fl{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0);transition:transform .38s cubic-bezier(.3,1.9,.5,1);transition-delay:calc(var(--i)*55ms)}
.cake .fk{transform-box:fill-box;transform-origin:50% 100%;animation:flick .42s ease-in-out infinite alternate;animation-delay:calc(var(--i)*-.17s)}
@keyframes flick{from{transform:scale(1,.92) skewX(-4deg)}to{transform:scale(.94,1.1) skewX(5deg)}}
.pop.lit .cake .fl{transform:scale(1)}
.pop.lit .cake .glow{opacity:1}
.cap{
  margin:0;text-align:center;text-wrap:balance;color:var(--paper);
  font-size:clamp(22px,6.2vw,40px);line-height:1.18;
  opacity:0;transform:translateY(10px) scale(.92);transition:opacity .3s,transform .45s cubic-bezier(.3,1.7,.5,1);
}
.cap2{display:block;margin-top:.18em;font-size:.82em;color:var(--rose)}
.cap2 svg{display:inline-block;width:.78em;height:.72em;margin-left:.3em;vertical-align:-.02em}
.again{
  appearance:none;border:0;cursor:pointer;background:var(--sky);color:var(--ink);
  font-size:17px;line-height:1;padding:13px 22px 14px;border-radius:999px;box-shadow:0 4px 0 rgba(36,18,96,.45);
  opacity:0;transform:translateY(10px);transition:opacity .3s .12s,transform .45s .12s cubic-bezier(.3,1.7,.5,1);
}
.again:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(36,18,96,.45)}
.pop.lit .cap,.pop.lit .again{opacity:1;transform:none}
.x{
  position:absolute;top:14px;left:14px;z-index:4;width:46px;height:46px;border-radius:50%;border:0;cursor:pointer;
  background:var(--paper);color:var(--ink);display:grid;place-items:center;box-shadow:0 4px 0 rgba(36,18,96,.45);
}
.x svg{width:18px;height:18px;display:block}
.again:focus-visible,.x:focus-visible{outline:4px solid var(--butter);outline-offset:3px}

@media (prefers-reduced-motion:reduce){
  .pulse,.rays,.cake .fk{animation:none}
  .hb,.cap,.again,.cake .fl,.pop{transition:none}
}
</style>

      var el=document.createElementNS(NS,'text'),n=Array.from(ln).length,rot=[],dy=[],prev=0;
      for(var j=0;j<n;j++){var k=(j+i*4)%ROT.length,q=WOB[lang],jv=+(JIT[k]*q).toFixed(1);rot.push(+(ROT[k]*q).toFixed(1));dy.push(+(jv-prev).toFixed(1));prev=jv}
      el.setAttribute('x',0);el.setAttribute('y',i*106);el.setAttribute('text-anchor','middle');
      el.setAttribute('rotate',rot.join(' '));el.setAttribute('dy',dy.join(' '));
      el.textContent=ln;g.appendChild(el);
    });
    title.appendChild(g);
  });
  var bb=title.querySelector('.t-fl').getBBox(),pad=26;
  var vb=[bb.x-pad,bb.y-pad,bb.width+pad*2+6,bb.height+pad*2+10];
  title.setAttribute('viewBox',vb.join(' '));
  title.style.setProperty('--ar',(vb[2]/vb[3]).toFixed(3));title.style.setProperty('--vbw',vb[2].toFixed(1));
  title.classList.toggle('two',lines.length>1);
  if(animate&&!reduce&&title.animate){
    title.animate([
      {transform:'scale(.72) rotate(-7deg)',opacity:0},
      {transform:'scale(1.06) rotate(2deg)',opacity:1,offset:.6},
      {transform:'none',opacity:1}],{duration:440,easing:'cubic-bezier(.2,.9,.3,1)'});
  }
}
function setLang(l,animate){
  lang=l;var t=I18N[l];
  document.documentElement.lang=t.lang;
  cap.textContent=t.cap;
  if(t.cap2){var s2=document.createElement('span');s2.className='cap2';s2.textContent=t.cap2;s2.insertAdjacentHTML('beforeend',HEART);cap.appendChild(s2)}
  again.textContent=t.again;
  closeBtn.setAttribute('aria-label',t.close);langBox.setAttribute('aria-label',t.langs);
  hb.setAttribute('aria-label',t.title.join(l==='zh'?'':' '));
  Array.prototype.forEach.call(langBox.children,function(b){b.setAttribute('aria-pressed',String(b.dataset.l===l))});
  drawTitle(animate);
  try{localStorage.setItem('bday-lang',l)}catch(e){}
}
Object.keys(I18N).forEach(function(l){
  var b=document.createElement('button');b.type='button';b.dataset.l=l;b.lang=I18N[l].lang;b.textContent=I18N[l].name;
  b.addEventListener('click',function(){if(l!==lang)setLang(l,true)});
  langBox.appendChild(b);
});

/* ================= bouncing stickers ================= */
var EDGE=['var(--paper)','var(--butter)','var(--rose)','var(--mint)','var(--sky)'];
var W=0,H=0,sprites=[],running=false,last=0;
function rnd(a,b){return a+Math.random()*(b-a)}
function unit(){var m=Math.min(W,H);return Math.max(90,Math.min(206,m*0.17+30))}
SPRITES.forEach(function(s,i){
  var el=document.createElement('div');el.className='sp';
  el.style.setProperty('--m','url("'+s.edge+'")');
  el.style.setProperty('--tilt',rnd(-7,7).toFixed(1)+'deg');
  el.innerHTML='<div class="in"><i class="sh"></i><i class="ed"></i><img alt="" decoding="async" src="'+s.img+'"></div>';
  sky.appendChild(el);
  var a=(Math.PI/4)*(1+2*Math.floor(Math.random()*4))+rnd(-.34,.34);
  sprites.push({el:el,inn:el.firstChild,ar:s.w/s.h,k:rnd(.86,1.18),dx:Math.cos(a),dy:Math.sin(a),sp:rnd(.85,1.2),ci:i%EDGE.length,x:-1,y:-1,w:0,h:0});
  el.style.setProperty('--c',EDGE[i%EDGE.length]);
});
var REST=[[.03,.1],[.74,.04],[.01,.66],[.8,.62],[.38,.0],[.42,.8],[.9,.3]];
function layout(){
  W=document.body.clientWidth;H=document.body.clientHeight;
  var u=unit();
  sprites.forEach(function(s,i){
    s.h=Math.round(u*s.k*1.07);s.w=Math.round(s.h*s.ar);
    s.el.style.width=s.w+'px';s.el.style.height=s.h+'px';
    if(s.x<0||reduce){
      if(reduce){s.x=REST[i][0]*(W-s.w);s.y=REST[i][1]*(H-s.h)}
      else{s.x=rnd(0,Math.max(1,W-s.w));s.y=rnd(0,Math.max(1,H-s.h))}
    }
    s.x=Math.max(0,Math.min(s.x,W-s.w));s.y=Math.max(0,Math.min(s.y,H-s.h));
    place(s);
  });
}
function place(s){s.el.style.transform='translate3d('+s.x.toFixed(1)+'px,'+s.y.toFixed(1)+'px,0)'}
function hit(s,axis){
  s.ci=(s.ci+1)%EDGE.length;s.el.style.setProperty('--c',EDGE[s.ci]);
  if(s.inn.animate){
    var t=getComputedStyle(s.el).getPropertyValue('--tilt')||'0deg';
    var sq=axis==='x'?'scale(.9,1.07)':'scale(1.07,.9)';
    s.inn.animate([{transform:'rotate('+t+') '+sq},{transform:'rotate('+t+') scale(1)'}],{duration:320,easing:'cubic-bezier(.3,1.8,.5,1)'});
  }
}
function tick(now){
  if(!running)return;
  var dt=Math.min(.05,(now-last)/1000);last=now;
  var v=Math.max(58,Math.min(128,Math.min(W,H)*.13));
  for(var i=0;i<sprites.length;i++){
    var s=sprites[i];
    s.x+=s.dx*s.sp*v*dt;s.y+=s.dy*s.sp*v*dt;
    if(s.x<=0){s.x=0;s.dx=Math.abs(s.dx);hit(s,'x')}
    else if(s.x>=W-s.w){s.x=W-s.w;s.dx=-Math.abs(s.dx);hit(s,'x')}
    if(s.y<=0){s.y=0;s.dy=Math.abs(s.dy);hit(s,'y')}
    else if(s.y>=H-s.h){s.y=H-s.h;s.dy=-Math.abs(s.dy);hit(s,'y')}
    place(s);
  }
  requestAnimationFrame(tick);
}
function run(on){
  if(reduce)return;
  if(on&&!running){running=true;last=performance.now();requestAnimationFrame(tick)}
  else if(!on)running=false;
}

/* ================= the cake gag ================= */
var anims=[],timers=[],scale=1,isOpen=false;
/* cake poses in stage px: centre x, centre y, rotation, scale */
var P={hide:[650,486,-24,.2],out:[770,465,-10,.5],mid:[624,204,6,1.56],hold:[600,212,-4,1.4]};
function pose(p){return 'translate('+(p[0]-100)+'px,'+(p[1]-118)+'px) rotate('+p[2]+'deg) scale('+p[3]+')'}
var ARM_UP=-13;
function fitStage(){
  var pw=pop.clientWidth,ph=pop.clientHeight;
  var wide=ph<540&&pw>ph*1.25;
  col.classList.toggle('wide',wide);
  var aw=wide?Math.min(pw*.56,ph*1.1):Math.min(pw-24,820);
  var ah=wide?ph-28:ph-58-18-24-(cap.offsetHeight||60)-(again.offsetHeight||46);
  scale=Math.max(.1,Math.min(aw/STAGE.w,ah/STAGE.h));
  fit.style.width=Math.round(STAGE.w*scale)+'px';fit.style.height=Math.round(STAGE.h*scale)+'px';
  stage.style.transform='scale('+scale.toFixed(4)+')';
  var r=window.devicePixelRatio||1;fx.width=Math.round(pw*r);fx.height=Math.round(ph*r);
}
function stopGag(){
  anims.forEach(function(a){a.cancel()});anims=[];
  timers.forEach(clearTimeout);timers=[];
  pop.classList.remove('lit');confettiStop();
  arm.style.transform='';cake.style.transform='';cake.style.opacity='';cake.style.zIndex='';
}
function A(el,frames,opt){opt.fill='forwards';var a=el.animate(frames,opt);anims.push(a);return a}
function later(fn,ms){timers.push(setTimeout(fn,ms))}
function finalPose(){
  arm.style.transform='rotate('+ARM_UP+'deg)';
  cake.style.transform=pose(P.hold);cake.style.opacity='1';cake.style.zIndex='4';
  pop.classList.add('lit');
}
function playGag(){
  stopGag();
  if(reduce||!fig.animate){finalPose();return}
  /* 1. he pops in */
  A(fig,[{transform:'translateY(140px) scale(.82)',opacity:0},{transform:'translateY(-14px) scale(1.03)',opacity:1,offset:.68},{transform:'none',opacity:1}],
    {duration:540,easing:'cubic-bezier(.2,.8,.3,1)'});
  /* 2. rummages in the jacket */
  var r=function(d){return {transform:'rotate('+d+'deg)'}};
  A(arm,[r(0),r(4.5),r(-1.5),r(5),r(-1),r(3.5),r(0)],{delay:700,duration:900,easing:'ease-in-out'});
  A(fig,[r(0),r(.9),r(-.7),r(.9),r(-.5),r(0)],{delay:700,duration:900,easing:'ease-in-out'});
  /* 3. something slides out from under the jacket edge */
  A(cake,[{opacity:1,transform:pose(P.hide)},{opacity:1,transform:pose(P.out)}],{delay:1640,duration:430,easing:'cubic-bezier(.3,.7,.3,1)'});
  A(arm,[r(0),r(3.5),r(-2)],{delay:1640,duration:430,easing:'ease-in-out'});
  /* 4. …and up it goes: a whole cake */
  A(cake,[{opacity:1,zIndex:4,transform:pose(P.out),easing:'cubic-bezier(.3,.6,.4,1)'},
          {opacity:1,zIndex:4,transform:pose(P.mid),offset:.62,easing:'ease-in-out'},
          {opacity:1,zIndex:4,transform:pose(P.hold)}],{delay:2070,duration:780});
  A(arm,[{transform:'rotate(-2deg)',easing:'cubic-bezier(.3,.6,.4,1)'},{transform:'rotate(-17deg)',offset:.6,easing:'ease-in-out'},{transform:'rotate('+ARM_UP+'deg)'}],
    {delay:2070,duration:780});
  /* 5. candles + confetti */
  later(function(){pop.classList.add('lit');burst()},2870);
}
function openPop(){
  if(isOpen)return;isOpen=true;run(false);
  pop.hidden=false;fitStage();
  requestAnimationFrame(function(){pop.classList.add('on');playGag();closeBtn.focus({preventScroll:true})});
}
function closePop(){
  if(!isOpen)return;isOpen=false;
  pop.classList.remove('on');
  setTimeout(function(){if(!isOpen){pop.hidden=true;stopGag()}},240);
  run(true);hb.focus({preventScroll:true});
}
hb.addEventListener('click',openPop);
closeBtn.addEventListener('click',closePop);
again.addEventListener('click',playGag);
pop.addEventListener('click',function(e){if(e.target===pop||e.target===col||e.target.className==='rays')closePop()});
document.addEventListener('keydown',function(e){
  if(!isOpen)return;
  if(e.key==='Escape'){closePop();return}
  if(e.key==='Tab'){ /* keep focus inside the dialog */
    var f=[closeBtn].concat(Array.prototype.slice.call(langBox.children),pop.classList.contains('lit')?[again]:[]);
    var i=f.indexOf(document.activeElement);e.preventDefault();
    f[(i+(e.shiftKey?f.length-1:1))%f.length].focus();
  }
});

/* ---- confetti ---- */
var bits=[],fxOn=false,fxLast=0,ctx=fx.getContext('2d');
var COLORS=['#FFF8EC','#FFE680','#FF9CCB','#8FECD2','#A6DCFF'];
function burst(){
  var c=cake.getBoundingClientRect(),p=pop.getBoundingClientRect();
  var ox=c.left+c.width/2-p.left,oy=c.top+c.height*.35-p.top,k=Math.max(.6,Math.min(1.25,p.width/900));
  for(var i=0;i<150;i++){
    var a=rnd(-Math.PI*.98,-Math.PI*.02),v=rnd(260,900)*k;
    bits.push({x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-rnd(0,220)*k,w:rnd(6,12)*k,h:rnd(8,18)*k,r:rnd(0,6.3),vr:rnd(-9,9),c:COLORS[i%5],t:0,life:rnd(2.2,3.6),round:i%6===0});
  }
  if(!fxOn){fxOn=true;fxLast=performance.now();requestAnimationFrame(fxTick)}
}
function confettiStop(){bits=[];fxOn=false;ctx.clearRect(0,0,fx.width,fx.height)}
function fxTick(now){
  if(!fxOn)return;
  var dt=Math.min(.05,(now-fxLast)/1000);fxLast=now;
  var r=fx.width/Math.max(1,pop.clientWidth);
  ctx.setTransform(r,0,0,r,0,0);ctx.clearRect(0,0,pop.clientWidth,pop.clientHeight);
  for(var i=bits.length-1;i>=0;i--){
    var b=bits[i];b.t+=dt;
    if(b.t>b.life||b.y>pop.clientHeight+40){bits.splice(i,1);continue}
    b.vy+=1150*dt;b.vx*=(1-1.5*dt);b.vy*=(1-.9*dt);b.x+=b.vx*dt;b.y+=b.vy*dt;b.r+=b.vr*dt;
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.r);ctx.globalAlpha=Math.min(1,(b.life-b.t)*2.5);ctx.fillStyle=b.c;
    var flip=Math.cos(b.t*9+b.r);
    if(b.round){ctx.beginPath();ctx.arc(0,0,b.w*.55,0,6.3);ctx.fill()}
    else ctx.fillRect(-b.w/2,-b.h/2*flip,b.w,b.h*flip);
    ctx.restore();
  }
  if(bits.length)requestAnimationFrame(fxTick);else{fxOn=false;ctx.clearRect(0,0,pop.clientWidth,pop.clientHeight)}
}

/* ================= boot ================= */
function onResize(){layout();drawTitle(false);if(isOpen)fitStage()}
window.addEventListener('resize',onResize);
document.addEventListener('visibilitychange',function(){run(!document.hidden&&!isOpen)});
setLang(lang,false);layout();run(true);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){titleKey='';drawTitle(false)});
})();
</script>
